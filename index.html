<html lang="pt-BR">

<meta charset="UTF-8">

<title>ARSENAL 1968</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#68685c;
color:white;
overflow-x:hidden;

}

:root{

--verde:#071216;
--verde2:#c0b08f;
--preto:#68685c;
--cinza:#222;
--cinza2:#333;
--branco:#eee;
--vermelho:#b80000;

}

header{

position:fixed;
top:0;
left:0;
width:100%;
height:70px;

background:#010608;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 25px;

z-index:999;

border-bottom:2px solid var(--verde);

}

.logo{

font-size:26px;
font-weight:bold;
letter-spacing:3px;

color:var(--verde2);

}

.logo span{

color:white;

}

.menu{

display:flex;
gap:15px;

}

.menu button{

background:transparent;

border:1px solid var(--verde);

color:white;

padding:10px 18px;

cursor:pointer;

transition:.3s;

border-radius:6px;

}

.menu button:hover{

background:var(--verde);

color:#68685c;

}

main{

margin-top:90px;

padding:20px;

}

.hero{

width:100%;

height:260px;

border-radius:15px;

background:

linear-gradient(

rgba(0,0,0,.5),

rgba(0,0,0,.5)

),

url("https://i.ibb.co/39c4JH8w/1784667805406.png");

background-size:cover;

background-position:center;

display:flex;

flex-direction:column;

justify-content:center;

padding:40px;

border:2px solid var(--verde);

}

.hero h1{

font-size:42px;

margin-bottom:10px;

}

.hero p{

max-width:700px;

line-height:1.6;

color:#ddd;

}

.search-area{

margin-top:30px;

display:flex;

gap:15px;

flex-wrap:wrap;

}

.search{

flex:1;

min-width:260px;

padding:15px;

background:#222;

border:none;

outline:none;

color:white;

font-size:16px;

border-radius:8px;

}

.filter{

padding:15px;

background:#222;

color:white;

border:none;

border-radius:8px;

cursor:pointer;

}

.stats{

margin-top:30px;

display:grid;

grid-template-columns:repeat(auto-fit,minmax(180px,1fr));

gap:20px;

}

.stat{

background:#222;

padding:20px;

border-radius:10px;

border-left:5px solid var(--verde);

}

.stat h2{

font-size:34px;

color:var(--verde2);

}

.stat p{

margin-top:10px;

color:#ccc;

}

.cards{

margin-top:40px;

display:grid;

grid-template-columns:repeat(auto-fill,minmax(280px,1fr));

gap:25px;

}

.card{

background:#1e1e1e;

border-radius:12px;

overflow:hidden;

transition:.3s;

cursor:pointer;

border:1px solid #333;

}

.card:hover{

transform:translateY(-6px);

border-color:var(--verde);

}

.card img{

width:100%;

height:180px;

object-fit:cover;

}

.card-body{

padding:18px;

}

.card-title{

font-size:22px;

margin-bottom:10px;

}

.card-category{

display:inline-block;

padding:6px 12px;

background:var(--verde);

color:#c0b08f;

font-weight:bold;

border-radius:5px;

margin-bottom:15px;

}

.card-info{

display:flex;

justify-content:space-between;

margin-top:15px;

font-size:14px;

color:#bbb;

}

.modal{

position:fixed;

left:0;

top:0;

width:100%;

height:100%;

background:rgba(0,0,0,.85);

display:none;

align-items:center;

justify-content:center;

padding:20px;

z-index:9999;

}

.modal-content{

background:#202020;

width:100%;

max-width:900px;

border-radius:15px;

overflow:auto;

max-height:90vh;

border:2px solid var(--verde);

}

.close{

float:right;

font-size:35px;

cursor:pointer;

padding:15px;

}

.modal img{

width:100%;

height:350px;

object-fit:cover;

}

.modal-body{

padding:25px;

}

.modal-body h2{

margin-bottom:15px;

font-size:34px;

}

.modal-body p{

line-height:1.7;

margin-bottom:12px;

color:#ddd;

}

@media(max-width:700px){

.hero{

height:auto;

padding:25px;

}

.hero h1{

font-size:30px;

}

header{

padding:15px;

flex-direction:column;

height:auto;

}

main{

margin-top:120px;

}

}#oficina{

display:none;

gap:20px;

padding:20px;

}


#pesquisaOficina{

width:100%;

padding:12px;

font-size:16px;

margin-bottom:15px;

border-radius:10px;

border:none;

}

#oficinaImagem{

width:100%;

max-width:350px;

height:220px;

margin:auto;

display:block;

object-fit:contain;

background:#222;

border-radius:12px;

padding:10px;

}

#listaArmasOficina{

display:flex;

flex-direction:column;

gap:10px;

max-width:700px;

margin:auto;

}

.armaOficina{

display:flex;

align-items:center;

gap:15px;

padding:12px;

background:#242424;

border-radius:12px;

cursor:pointer;

transition:.2s;

border:1px solid #333;

}

.armaOficina:hover{

transform:scale(1.02);

background:#323232;

}

.armaOficina img{

width:80px;

height:60px;

object-fit:contain;

background:#111;

padding:5px;

border-radius:8px;

flex-shrink:0;

}
#listaAcessorios{

display:grid;

grid-template-columns:repeat(auto-fill,minmax(180px,1fr));

gap:12px;

margin-top:15px;

}
.itemAcessorio{

background:#262626;

border-radius:10px;

padding:12px;

text-align:center;

border:1px solid #444;

}

.itemAcessorio:hover{

transform:translateY(-3px);

}

.itemAcessorio button{

width:100%;

margin-top:10px;

padding:10px;

font-weight:bold;

border:none;

border-radius:8px;

cursor:pointer;

}@media(max-width:768px){

#oficina{

padding:12px;

}

#oficinaImagem{

width:100%;

max-width:260px;

height:150px;

}

#listaArmasOficina{

max-width:100%;

}

#listaAcessorios{

grid-template-columns:1fr;

}

.itemAcessorio{

padding:10px;

}

}
#oficinaLista{

display:block;

}

#oficinaFicha{

max-width:700px;

margin:auto;

}

#voltarLista{

margin-bottom:20px;

padding:10px 18px;

border:none;

border-radius:8px;

cursor:pointer;

font-size:16px;

font-weight:bold;

}
.imgAcessorio{

width:42px;

height:42px;

object-fit:contain;

display:block;

margin:auto;

margin-bottom:8px;

}
</style>

const cards = document.getElementById("cards");

const pesquisa = document.querySelector(".search");

const filtro = document.querySelector(".filter");


let favoritos = [];

function carregarArmas(lista = armas){

cards.innerHTML = "";

lista.forEach((arma)=>{

    cards.innerHTML += `

<div class="card" onclick="abrirArma(${armas.indexOf(arma)})">

<img src="${arma.imagem}">

<div class="card-body">

<div class="card-title">
${arma.nome}
</div>

<div class="card-category">
${arma.categoria}
</div>

<p>
${arma.descricao}
</p>

<div class="card-info">

<span>${arma.calibre}</span>

<span>${arma.pais}</span>

</div>

</div>

</div>

`;

});

document.getElementById("totalArmas").innerText = lista.length;

}



carregarArmas();



function abrirArma(index){


const arma = armas[index];


document.getElementById("modalImagem").src = arma.imagem;


document.getElementById("modalTitulo").innerText = arma.nome;


document.getElementById("modalDescricao").innerText = arma.descricao;


document.getElementById("modalCalibre").innerText = arma.calibre;


document.getElementById("modalCategoria").innerText = arma.categoria;


document.getElementById("modalDano").innerText = arma.dano;


document.getElementById("modalCritico").innerText = arma.critico;


document.getElementById("modalEspacos").innerText = arma.espacos;


document.getElementById("modalPeso").innerText = arma.peso;


document.getElementById("modalPais").innerText = arma.pais;


document.getElementById("modalAno").innerText = arma.ano;



document.getElementById("modal").style.display="flex";


}



function fecharModal(){


document.getElementById("modal").style.display="none";


}



window.onclick=function(event){


const modal=document.getElementById("modal");


if(event.target===modal){

fecharModal();

}


}



pesquisa.addEventListener("input",()=>{


const texto=pesquisa.value.toLowerCase();


const resultado=armas.filter((arma)=>{


return (

arma.nome.toLowerCase().includes(texto)

||

arma.categoria.toLowerCase().includes(texto)

||

arma.calibre.toLowerCase().includes(texto)

||

arma.pais.toLowerCase().includes(texto)


);


});


carregarArmas(resultado);


});


filtro.addEventListener("change",()=>{


const categoria=filtro.value;


if(categoria==="Todas"){

carregarArmas();

return;

}



const resultado = armas.filter((arma)=>{


const nomeCategoria = arma.categoria.toLowerCase();


const filtroCategoria = categoria.toLowerCase();



if(filtroCategoria === "pistolas"){

return nomeCategoria.includes("pistola");

}

if(filtroCategoria==="revólveres"){

return nomeCategoria.includes("revólver");

}

if(filtroCategoria === "fuzis"){

return nomeCategoria.includes("fuzil") || nomeCategoria.includes("carabina");

}


if(filtroCategoria === "submetralhadoras"){

return nomeCategoria.includes("submetralhadora");

}


if(filtroCategoria === "escopetas"){

return nomeCategoria.includes("escopeta");

}


if(filtroCategoria === "metralhadoras"){

return nomeCategoria.includes("metralhadora");

}


if(filtroCategoria === "snipers"){

return nomeCategoria.includes("sniper");

}


if(filtroCategoria === "explosivos"){

return nomeCategoria.includes("explosivo") || nomeCategoria.includes("antitanque");

}


if(filtroCategoria === "armas brancas"){

return nomeCategoria.includes("branca");

}



return false;


});


carregarArmas(resultado);



});


// SISTEMA DE FAVORITOS


function alternarFavorito(index){


if(favoritos.includes(index)){


favoritos = favoritos.filter(id=>id!==index);


}else{


favoritos.push(index);


}


salvarFavoritos();


}



function salvarFavoritos(){


localStorage.setItem(

"arsenal1968_favoritos",

JSON.stringify(favoritos)

);


}



function carregarFavoritos(){


const dados = localStorage.getItem(

"arsenal1968_favoritos"

);



if(dados){


favoritos = JSON.parse(dados);


}


}



carregarFavoritos();



// FUNÇÃO PARA MOSTRAR APENAS FAVORITOS


function mostrarFavoritos(){


const lista = armas.filter((arma,index)=>{


return favoritos.includes(index);


});



carregarArmas(lista);



}

// ANIMAÇÃO DE ENTRADA DOS CARDS


function animarCards(){


const elementos=document.querySelectorAll(".card");


elementos.forEach((card,i)=>{


card.style.opacity="0";


card.style.transform="translateY(20px)";



setTimeout(()=>{


card.style.transition=".4s";


card.style.opacity="1";


card.style.transform="translateY(0)";


},i*50);



});


}

carregarArmas=function(lista=armas){


carregamentoOriginal(lista);


setTimeout(animarCards,50);


};

function selecionarArma(nome){
    document.getElementById("oficinaLista").style.display="none";

document.getElementById("oficinaFicha").style.display="block";

document.getElementById("oficinaLicenca").innerText=

"Licença: "+(arma.licenca||"Classe 0");

<p><b>Dano:</b> ${arma.dano}</p>

<p><b>Crítico:</b> ${arma.critico}</p>

<p><b>Peso:</b> ${arma.peso}</p>

<p><b>Calibre:</b> ${arma.calibre}</p>

`;
const lista=document.getElementById("listaAcessorios");

lista.innerHTML="";
acessorios.forEach((item)=>{

if(
    item.compativel.some(tipo =>
        arma.categoria.includes(tipo)

){

<div class="itemAcessorio"

onclick="equiparAcessorio('${item.nome}')">

<img src="${item.imagem}" class="imgAcessorio">

<h4>${item.nome}</h4>

<p>${item.tipo}</p>

<p>${item.licenca}</p>

<p>

Precisão: ${item.bonus.precisao}

<br>

Recuo: ${item.bonus.recuo}

<br>

Capacidade: ${item.bonus.capacidade}

</p>

<button>

Equipar

</button>

</div>

`;

}

});
let armaAtual=null;

let equipamentos=[];
function equiparAcessorio(nome){

if(equipamentos.includes(nome)){

equipamentos=equipamentos.filter(a=>a!=nome);

}else{

equipamentos.push(nome);

}

mostrarEquipados();

}
function mostrarEquipados(){

const itens=document.querySelectorAll(".itemAcessorio");

itens.forEach((card)=>{

const titulo=card.querySelector("h4").innerText;

if(equipamentos.includes(titulo)){

card.style.border="2px solid lime";

}else{

card.style.border="2px solid transparent";

}

});

}

}
